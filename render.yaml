services:
  - type: web
    name: aryan-panel-shop
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
